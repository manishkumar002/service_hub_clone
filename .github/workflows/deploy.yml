name: CD Production Deployment

on:
  workflow_run:
    workflows:
      - CI Pipeline
    types:
      - completed
    branches:
      - master

jobs:
  deploy:
    name: Deploy to Production

    if: >
      ${{ github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push' }}

    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. Checkout exact code that passed CI
      # ==========================================

      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # ==========================================
      # 2. Verify project
      # ==========================================

      - name: Verify Project Structure
        run: |

          set -e

          echo "Checking project structure..."

          test -d Backend/gateway
          test -d Backend/services/auth-service
          test -d Backend/services/category-service

          test -f Backend/gateway/package-lock.json
          test -f Backend/services/auth-service/package-lock.json
          test -f Backend/services/category-service/package-lock.json

          echo "Project structure OK."

      # ==========================================
      # 3. Create deployment package
      # ==========================================

      - name: Create Deployment Package
        run: |

          set -e

          echo "Creating deployment package..."

          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='*.log' \
            -czf deploy.tar.gz Backend

          ls -lh deploy.tar.gz

          echo "Package created successfully."

      # ==========================================
      # 4. Upload to server
      # ==========================================

      - name: Upload Package To Server
        uses: appleboy/scp-action@v0.1.7

        with:
          host: ${{ secrets.SERVER_HOST }}

          username: ${{ secrets.SERVER_USER }}

          key: ${{ secrets.SERVER_SSH_KEY }}

          port: ${{ secrets.SERVER_PORT }}

          source: "deploy.tar.gz"

          target: "/tmp"

          timeout: 60s

          command_timeout: 5m

      # ==========================================
      # 5. Deploy
      # ==========================================

      - name: Deploy Application
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.SERVER_HOST }}

          username: ${{ secrets.SERVER_USER }}

          key: ${{ secrets.SERVER_SSH_KEY }}

          port: ${{ secrets.SERVER_PORT }}

          timeout: 60s

          command_timeout: 15m

          script: |

            set -e

            echo "======================================"
            echo "STARTING PRODUCTION DEPLOYMENT"
            echo "======================================"

            # ======================================
            # Node.js
            # ======================================

            export NVM_DIR="/root/.nvm"

            export PATH="/root/.nvm/versions/node/v22.20.0/bin:$PATH"

            echo "Node:"
            node -v

            echo "NPM:"
            npm -v

            echo "PM2:"
            pm2 -v


            # ======================================
            # Project directory
            # ======================================

            PROJECT_DIR="/home/api/htdocs/api.ilearnings.in"

            echo "Project:"
            echo "$PROJECT_DIR"

            mkdir -p "$PROJECT_DIR"

            cd "$PROJECT_DIR"


            # ======================================
            # Check package
            # ======================================

            if [ ! -f /tmp/deploy.tar.gz ]; then

              echo "ERROR: deploy.tar.gz not found!"

              exit 1

            fi


            # ======================================
            # Prepare new deployment
            # ======================================

            rm -rf Backend_new

            mkdir -p Backend_new

            tar -xzf /tmp/deploy.tar.gz \
              -C Backend_new \
              --strip-components=1

            rm -f /tmp/deploy.tar.gz


            # ======================================
            # Verify new code
            # ======================================

            test -d Backend_new/gateway

            test -d Backend_new/services/auth-service

            test -d Backend_new/services/category-service


            # ======================================
            # Preserve Gateway .env
            # ======================================

            if [ -f Backend/gateway/.env ]; then

              cp \
                Backend/gateway/.env \
                Backend_new/gateway/.env

            fi


            # ======================================
            # Preserve Auth .env
            # ======================================

            if [ -f Backend/services/auth-service/.env ]; then

              cp \
                Backend/services/auth-service/.env \
                Backend_new/services/auth-service/.env

            fi


            # ======================================
            # Preserve Category .env
            # ======================================

            if [ -f Backend/services/category-service/.env ]; then

              cp \
                Backend/services/category-service/.env \
                Backend_new/services/category-service/.env

            fi


            # ======================================
            # Install Gateway
            # ======================================

            cd "$PROJECT_DIR/Backend_new/gateway"

            npm ci --omit=dev


            # ======================================
            # Install Auth
            # ======================================

            cd "$PROJECT_DIR/Backend_new/services/auth-service"

            npm ci --omit=dev


            # ======================================
            # Install Category
            # ======================================

            cd "$PROJECT_DIR/Backend_new/services/category-service"

            npm ci --omit=dev


            # ======================================
            # Backup old application
            # ======================================

            cd "$PROJECT_DIR"

            rm -rf Backend_old

            if [ -d Backend ]; then

              mv Backend Backend_old

            fi


            # ======================================
            # Activate new application
            # ======================================

            mv Backend_new Backend


            # ======================================
            # Permissions
            # ======================================

            chown -R api:clp "$PROJECT_DIR/Backend"


            # ======================================
            # DELETE OLD PM2 PROCESSES
            # ======================================

            echo "Deleting old PM2 processes..."

            pm2 delete gateway || true

            pm2 delete auth-service || true

            pm2 delete category-service || true


            # ======================================
            # START GATEWAY
            # ======================================

            echo "Starting Gateway..."

            pm2 start npm \
              --name gateway \
              --cwd "$PROJECT_DIR/Backend/gateway" \
              -- start


            # ======================================
            # START AUTH SERVICE
            # ======================================

            echo "Starting Auth Service..."

            pm2 start npm \
              --name auth-service \
              --cwd "$PROJECT_DIR/Backend/services/auth-service" \
              -- start


            # ======================================
            # START CATEGORY SERVICE
            # ======================================

            echo "Starting Category Service..."

            pm2 start npm \
              --name category-service \
              --cwd "$PROJECT_DIR/Backend/services/category-service" \
              -- start


            # ======================================
            # SAVE PM2
            # ======================================

            pm2 save


            # ======================================
            # STATUS
            # ======================================

            echo "======================================"
            echo "PM2 STATUS"
            echo "======================================"

            pm2 status


            # ======================================
            # VERIFY
            # ======================================

            echo "======================================"
            echo "VERIFYING SERVICES"
            echo "======================================"

            pm2 describe gateway

            pm2 describe auth-service

            pm2 describe category-service


            echo "======================================"
            echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
            echo "======================================"
