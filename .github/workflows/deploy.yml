name: CD Production Deployment

on:
  workflow_run:
    workflows:
      - CI Pipeline
    types:
      - completed
    branches:
      - master

jobs:
  deploy:
    name: Deploy to Production

    # Deploy only when CI succeeds
    if: >
      ${{ github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push' }}

    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. Checkout latest master code
      # ==========================================
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: master

      # ==========================================
      # 2. Check project structure
      # ==========================================
      - name: Verify Project Structure
        run: |
          echo "Checking project structure..."

          test -d Backend/gateway
          test -d Backend/services/auth-service
          test -d Backend/services/category-service

          test -f Backend/gateway/package-lock.json
          test -f Backend/services/auth-service/package-lock.json
          test -f Backend/services/category-service/package-lock.json

          echo "Project structure is valid."

      # ==========================================
      # 3. Create deployment package
      # ==========================================
      - name: Create Deployment Package
        run: |
          echo "Creating deployment package..."

          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='*.log' \
            -czf deploy.tar.gz Backend

          echo "Package created successfully."

          ls -lh deploy.tar.gz

      # ==========================================
      # 4. Upload package to server
      # ==========================================
      - name: Upload Package To Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}

          source: "deploy.tar.gz"
          target: "/tmp"

          timeout: 60s
          command_timeout: 5m

      # ==========================================
      # 5. Deploy application on server
      # ==========================================
      - name: Deploy Application
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}

          timeout: 60s
          command_timeout: 10m

          script: |

            set -e

            echo "======================================"
            echo "   STARTING PRODUCTION DEPLOYMENT"
            echo "======================================"

            # ======================================
            # Server information
            # ======================================

            echo "Server:"
            hostname

            echo "User:"
            whoami

            echo "Node version:"
            node -v

            echo "NPM version:"
            npm -v

            echo "PM2 version:"
            pm2 -v

            # ======================================
            # Project directory
            # ======================================

            PROJECT_DIR="/var/www/service_hub_clone"

            echo "Project directory:"
            echo "$PROJECT_DIR"

            mkdir -p "$PROJECT_DIR"

            # ======================================
            # Check uploaded package
            # ======================================

            if [ ! -f /tmp/deploy.tar.gz ]; then
              echo "ERROR: deploy.tar.gz not found!"
              exit 1
            fi

            echo "Deployment package found."

            # ======================================
            # Backup current Backend
            # ======================================

            cd "$PROJECT_DIR"

            if [ -d Backend ]; then
              echo "Existing Backend directory found."
              echo "Creating backup..."

              rm -rf Backend_backup
              mv Backend Backend_backup
            fi

            # ======================================
            # Extract new code
            # ======================================

            echo "Extracting new code..."

            tar -xzf /tmp/deploy.tar.gz

            rm -f /tmp/deploy.tar.gz

            echo "Code extracted successfully."

            # ======================================
            # Verify extracted structure
            # ======================================

            if [ ! -d "$PROJECT_DIR/Backend/gateway" ]; then
              echo "ERROR: Gateway directory not found!"
              exit 1
            fi

            if [ ! -d "$PROJECT_DIR/Backend/services/auth-service" ]; then
              echo "ERROR: Auth service directory not found!"
              exit 1
            fi

            if [ ! -d "$PROJECT_DIR/Backend/services/category-service" ]; then
              echo "ERROR: Category service directory not found!"
              exit 1
            fi

            echo "Application structure verified."

            # ======================================
            # Gateway
            # ======================================

            echo "======================================"
            echo "Installing Gateway dependencies"
            echo "======================================"

            cd "$PROJECT_DIR/Backend/gateway"

            npm ci --omit=dev

            # ======================================
            # Auth Service
            # ======================================

            echo "======================================"
            echo "Installing Auth Service dependencies"
            echo "======================================"

            cd "$PROJECT_DIR/Backend/services/auth-service"

            npm ci --omit=dev

            # ======================================
            # Category Service
            # ======================================

            echo "======================================"
            echo "Installing Category Service dependencies"
            echo "======================================"

            cd "$PROJECT_DIR/Backend/services/category-service"

            npm ci --omit=dev

            # ======================================
            # Restart Gateway
            # ======================================

            echo "======================================"
            echo "Restarting Gateway"
            echo "======================================"

            cd "$PROJECT_DIR/Backend/gateway"

            pm2 restart gateway || \
            pm2 start npm --name gateway -- start

            # ======================================
            # Restart Auth Service
            # ======================================

            echo "======================================"
            echo "Restarting Auth Service"
            echo "======================================"

            cd "$PROJECT_DIR/Backend/services/auth-service"

            pm2 restart auth-service || \
            pm2 start npm --name auth-service -- start

            # ======================================
            # Restart Category Service
            # ======================================

            echo "======================================"
            echo "Restarting Category Service"
            echo "======================================"

            cd "$PROJECT_DIR/Backend/services/category-service"

            pm2 restart category-service || \
            pm2 start npm --name category-service -- start

            # ======================================
            # Save PM2
            # ======================================

            echo "======================================"
            echo "Saving PM2 process list"
            echo "======================================"

            pm2 save

            # ======================================
            # Verify PM2
            # ======================================

            echo "======================================"
            echo "PM2 STATUS"
            echo "======================================"

            pm2 status

            echo "======================================"
            echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
            echo "======================================"
