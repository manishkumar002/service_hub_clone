name: CD Production Deployment

on:
  workflow_run:
    workflows:
      - CI Pipeline
    types:
      - completed
    branches:
      - master

jobs:
  deploy:
    name: Deploy to Production

    # Deploy only when CI was successful
    # and CI was triggered by push
    if: >
      ${{ github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push' }}

    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. Checkout latest master
      # ==========================================
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: master

      # ==========================================
      # 2. Verify project structure
      # ==========================================
      - name: Verify Project Structure
        run: |
          echo "======================================"
          echo "VERIFYING PROJECT STRUCTURE"
          echo "======================================"

          test -d Backend/gateway
          test -d Backend/services/auth-service
          test -d Backend/services/category-service

          test -f Backend/gateway/package-lock.json
          test -f Backend/services/auth-service/package-lock.json
          test -f Backend/services/category-service/package-lock.json

          echo "Project structure is valid."

      # ==========================================
      # 3. Create deployment package
      # ==========================================
      - name: Create Deployment Package
        run: |
          echo "======================================"
          echo "CREATING DEPLOYMENT PACKAGE"
          echo "======================================"

          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='*.log' \
            -czf deploy.tar.gz Backend

          echo "Deployment package created."

          ls -lh deploy.tar.gz

      # ==========================================
      # 4. Upload package to server
      # ==========================================
      - name: Upload Package To Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}

          source: "deploy.tar.gz"
          target: "/tmp"

          timeout: 60s
          command_timeout: 5m

      # ==========================================
      # 5. Deploy application
      # ==========================================
      - name: Deploy Application
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}

          timeout: 60s
          command_timeout: 15m

          script: |

            set -e

            echo "======================================"
            echo "STARTING PRODUCTION DEPLOYMENT"
            echo "======================================"

            # ======================================
            # Load Node.js
            # ======================================

            echo "Loading Node.js..."

            export NVM_DIR="/root/.nvm"
            export PATH="/root/.nvm/versions/node/v22.20.0/bin:$PATH"

            echo "Node path:"
            which node

            echo "Node version:"
            node -v

            echo "NPM path:"
            which npm

            echo "NPM version:"
            npm -v

            echo "PM2 path:"
            which pm2

            echo "PM2 version:"
            pm2 -v

            # ======================================
            # Server information
            # ======================================

            echo "======================================"
            echo "SERVER INFORMATION"
            echo "======================================"

            echo "Hostname:"
            hostname

            echo "User:"
            whoami

            # ======================================
            # CloudPanel project directory
            # ======================================

            PROJECT_DIR="/home/api/htdocs/api.ilearnings.in"

            echo "Project directory:"
            echo "$PROJECT_DIR"

            mkdir -p "$PROJECT_DIR"

            cd "$PROJECT_DIR"

            # ======================================
            # Check deployment package
            # ======================================

            if [ ! -f /tmp/deploy.tar.gz ]; then
              echo "ERROR: deploy.tar.gz not found!"
              exit 1
            fi

            echo "Deployment package found."

            # ======================================
            # Prepare new deployment
            # ======================================

            echo "======================================"
            echo "PREPARING NEW DEPLOYMENT"
            echo "======================================"

            rm -rf Backend_new

            mkdir -p Backend_new

            tar -xzf /tmp/deploy.tar.gz \
              -C Backend_new \
              --strip-components=1

            rm -f /tmp/deploy.tar.gz

            echo "New code extracted."

            # ======================================
            # Verify new code
            # ======================================

            echo "======================================"
            echo "VERIFYING NEW CODE"
            echo "======================================"

            test -d Backend_new/gateway
            test -d Backend_new/services/auth-service
            test -d Backend_new/services/category-service

            test -f Backend_new/gateway/package-lock.json
            test -f Backend_new/services/auth-service/package-lock.json
            test -f Backend_new/services/category-service/package-lock.json

            echo "New application structure verified."

            # ======================================
            # Preserve existing .env files
            # ======================================

            echo "======================================"
            echo "PRESERVING PRODUCTION ENV FILES"
            echo "======================================"

            if [ -f "$PROJECT_DIR/Backend/gateway/.env" ]; then
              cp "$PROJECT_DIR/Backend/gateway/.env" \
                 "$PROJECT_DIR/Backend_new/gateway/.env"

              echo "Gateway .env preserved."
            else
              echo "WARNING: Gateway .env not found."
            fi

            if [ -f "$PROJECT_DIR/Backend/services/auth-service/.env" ]; then
              cp "$PROJECT_DIR/Backend/services/auth-service/.env" \
                 "$PROJECT_DIR/Backend_new/services/auth-service/.env"

              echo "Auth service .env preserved."
            else
              echo "WARNING: Auth service .env not found."
            fi

            if [ -f "$PROJECT_DIR/Backend/services/category-service/.env" ]; then
              cp "$PROJECT_DIR/Backend/services/category-service/.env" \
                 "$PROJECT_DIR/Backend_new/services/category-service/.env"

              echo "Category service .env preserved."
            else
              echo "WARNING: Category service .env not found."
            fi

            # ======================================
            # Install Gateway dependencies
            # ======================================

            echo "======================================"
            echo "INSTALLING GATEWAY DEPENDENCIES"
            echo "======================================"

            cd "$PROJECT_DIR/Backend_new/gateway"

            npm ci --omit=dev

            # ======================================
            # Install Auth dependencies
            # ======================================

            echo "======================================"
            echo "INSTALLING AUTH SERVICE DEPENDENCIES"
            echo "======================================"

            cd "$PROJECT_DIR/Backend_new/services/auth-service"

            npm ci --omit=dev

            # ======================================
            # Install Category dependencies
            # ======================================

            echo "======================================"
            echo "INSTALLING CATEGORY SERVICE DEPENDENCIES"
            echo "======================================"

            cd "$PROJECT_DIR/Backend_new/services/category-service"

            npm ci --omit=dev

            # ======================================
            # Backup current Backend
            # ======================================

            echo "======================================"
            echo "BACKING UP CURRENT APPLICATION"
            echo "======================================"

            cd "$PROJECT_DIR"

            rm -rf Backend_old

            if [ -d Backend ]; then
              mv Backend Backend_old
              echo "Previous Backend backed up."
            fi

            # ======================================
            # Activate new Backend
            # ======================================

            echo "======================================"
            echo "ACTIVATING NEW APPLICATION"
            echo "======================================"

            mv Backend_new Backend

            echo "New Backend activated."

            # ======================================
            # Set CloudPanel ownership
            # ======================================

            echo "======================================"
            echo "SETTING FILE OWNERSHIP"
            echo "======================================"

            chown -R api:clp "$PROJECT_DIR/Backend"

            echo "Ownership updated."

            # ======================================
            # Restart Gateway
            # ======================================

            echo "======================================"
            echo "RESTARTING GATEWAY"
            echo "======================================"

            cd "$PROJECT_DIR/Backend/gateway"

            pm2 restart gateway --update-env || \
            pm2 start npm \
              --name gateway \
              --cwd "$PROJECT_DIR/Backend/gateway" \
              -- start

            # ======================================
            # Restart Auth Service
            # ======================================

            echo "======================================"
            echo "RESTARTING AUTH SERVICE"
            echo "======================================"

            cd "$PROJECT_DIR/Backend/services/auth-service"

            pm2 restart auth-service --update-env || \
            pm2 start npm \
              --name auth-service \
              --cwd "$PROJECT_DIR/Backend/services/auth-service" \
              -- start

            # ======================================
            # Restart Category Service
            # ======================================

            echo "======================================"
            echo "RESTARTING CATEGORY SERVICE"
            echo "======================================"

            cd "$PROJECT_DIR/Backend/services/category-service"

            pm2 restart category-service --update-env || \
            pm2 start npm \
              --name category-service \
              --cwd "$PROJECT_DIR/Backend/services/category-service" \
              -- start

            # ======================================
            # Save PM2
            # ======================================

            echo "======================================"
            echo "SAVING PM2 PROCESS LIST"
            echo "======================================"

            pm2 save

            # ======================================
            # PM2 status
            # ======================================

            echo "======================================"
            echo "PM2 STATUS"
            echo "======================================"

            pm2 status

            # ======================================
            # Final verification
            # ======================================

            echo "======================================"
            echo "VERIFYING APPLICATION"
            echo "======================================"

            test -d "$PROJECT_DIR/Backend/gateway"
            test -d "$PROJECT_DIR/Backend/services/auth-service"
            test -d "$PROJECT_DIR/Backend/services/category-service"

            echo "Application directories verified."

            echo "======================================"
            echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
            echo "======================================"
