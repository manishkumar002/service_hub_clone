name: CD Production Deployment

on:
  workflow_run:
    workflows:
      - CI Pipeline
    types:
      - completed
    branches:
      - master

jobs:
  deploy:
    name: Deploy to Production

    # Deploy only when:
    # 1. CI was successful
    # 2. CI was triggered by a push
    if: >
      ${{ github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push' }}

    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. Checkout latest master code
      # ==========================================
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: master

      # ==========================================
      # 2. Create deployment package
      # ==========================================
      - name: Create Deployment Package
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='*.log' \
            -czf deploy.tar.gz Backend

      # ==========================================
      # 3. Upload package to server
      # ==========================================
      - name: Upload Package to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}

          source: "deploy.tar.gz"
          target: "/tmp"

      # ==========================================
      # 4. Connect to server and deploy
      # ==========================================
      - name: Deploy Application
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}

          script: |

            set -e

            echo "===================================="
            echo "Starting Production Deployment"
            echo "===================================="

            # ------------------------------------
            # Create project directory
            # ------------------------------------

            mkdir -p /var/www/service_hub_clone

            cd /var/www/service_hub_clone

            # ------------------------------------
            # Extract new code
            # ------------------------------------

            echo "Extracting deployment package..."

            tar -xzf /tmp/deploy.tar.gz

            rm -f /tmp/deploy.tar.gz

            echo "Code extracted successfully."

            # ------------------------------------
            # Gateway
            # ------------------------------------

            echo "Installing Gateway dependencies..."

            cd /var/www/service_hub_clone/Backend/gateway

            npm ci --omit=dev

            # ------------------------------------
            # Auth Service
            # ------------------------------------

            echo "Installing Auth Service dependencies..."

            cd /var/www/service_hub_clone/Backend/services/auth-service

            npm ci --omit=dev

            # ------------------------------------
            # Category Service
            # ------------------------------------

            echo "Installing Category Service dependencies..."

            cd /var/www/service_hub_clone/Backend/services/category-service

            npm ci --omit=dev

            # ------------------------------------
            # Restart Gateway
            # ------------------------------------

            echo "Restarting Gateway..."

            cd /var/www/service_hub_clone/Backend/gateway

            pm2 restart gateway || \
            pm2 start npm --name gateway -- start

            # ------------------------------------
            # Restart Auth Service
            # ------------------------------------

            echo "Restarting Auth Service..."

            cd /var/www/service_hub_clone/Backend/services/auth-service

            pm2 restart auth-service || \
            pm2 start npm --name auth-service -- start

            # ------------------------------------
            # Restart Category Service
            # ------------------------------------

            echo "Restarting Category Service..."

            cd /var/www/service_hub_clone/Backend/services/category-service

            pm2 restart category-service || \
            pm2 start npm --name category-service -- start

            # ------------------------------------
            # Save PM2 process list
            # ------------------------------------

            pm2 save

            echo "===================================="
            echo "Deployment Completed Successfully"
            echo "===================================="
